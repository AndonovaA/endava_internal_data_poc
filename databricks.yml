# This is a Databricks asset bundle definition for internal_data_poc.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: internal_data_poc

# The run_as setting is not supported for pipelines or model serving endpoints.
# An error occurs if these resources are defined in a bundle where run_as is also configured.
#run_as:
#  service_principal_name: '7ab2b8bc-936a-491d-acf2-570901747771'

include:
  - resources/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy
    # Any job schedules and triggers are paused by default
    # When mode: development, the root_path must be in artifacts:  personal workspace not shared
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-2636851994577486.6.azuredatabricks.net
      root_path: ~/InternalDataPOC/.bundle

  qa:
    mode: production
    workspace:
      host: https://adb-2636851994577486.6.azuredatabricks.net
      # We explicitly specify /Shared/InternalDataPOC/.bundle_qa/${bundle.name}/${bundle.target} to make sure we only have a single copy.
      root_path: /Shared/InternalDataPOC/.bundle_qa/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
      - group_name: users
        level: CAN_MANAGE
    run_as:
      user_name: anastasija.andonova@endava.com

  prod:
    mode: production
    workspace:
      host: https://adb-2636851994577486.6.azuredatabricks.net
      # We explicitly specify /Shared/InternalDataPOC/.bundle_prod/${bundle.name}/${bundle.target} to make sure we only have a single copy.
      root_path: /Shared/InternalDataPOC/.bundle_prod/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
      - group_name: users
        level: CAN_MANAGE
    run_as:
      user_name: anastasija.andonova@endava.com
